name: build-bootc
on:
  schedule:
    - cron: "32 20 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build Custom Bootc Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. 释放虚拟机磁盘空间
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 登录 GHCR 和 阿里云 ACR
      - name: Log in to Registries (GHCR & Aliyun ACR)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "Logging in to Aliyun ACR..."
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | sudo podman login ${{ secrets.ALIYUN_ACR_REGISTRY }} -u ${{ secrets.ALIYUN_ACR_USERNAME }} --password-stdin

      # 3. 在宿主机原生构建系统镜像（无嵌套容器，无套娃挂载）
      - name: Build System Image
        run: |
          echo "Starting native Podman build..."
          sudo podman build \
            --security-opt seccomp=unconfined \
            -t ghcr.io/edwardwoodhub/my-lxqt-cloud:latest \
            -t ${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-cloud:latest \
            -f Containerfile .

      # 4. 推送镜像至两个 Registry（仅在 main 分支推送）
      - name: Push Images
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Pushing to GHCR..."
          sudo podman push ghcr.io/edwardwoodhub/my-lxqt-cloud:latest
          
          echo "Pushing directly to Aliyun ACR..."
          sudo podman push ${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-cloud:latest

  # ==========================================
  # Job 2：将构建好的镜像转换为 qcow2 磁盘镜像并上传 Artifacts
  # ==========================================
  build-disk:
    name: Build QCOW2 Disk Image
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Custom Image to Local
        run: |
          sudo podman pull ghcr.io/edwardwoodhub/my-lxqt-cloud:latest

      - name: Build QCOW2
        run: |
          echo "正在安装 qemu-utils..."
          sudo apt-get update && sudo apt-get install -y qemu-utils
          
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/edwardwoodhub/my-lxqt-cloud:latest

          echo "检测到生成了 disk.qcow2，开始进行 QEMU 极限块压缩..."
          sudo qemu-img convert -c -O qcow2 ./output/qcow2/disk.qcow2 ./output/qcow2/compressed.qcow2
          sudo mv ./output/qcow2/compressed.qcow2 ./output/qcow2/disk.qcow2
          
          echo "压缩完成！最终文件大小为："
          ls -lh ./output/qcow2/disk.qcow2

      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lxqt-qcow2
          path: ./output/qcow2/disk.qcow2
          if-no-files-found: error
