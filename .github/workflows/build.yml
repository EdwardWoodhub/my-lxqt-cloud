name: bluebuild
on:
  schedule:
    - cron:
        "32 20 * * *" # build at 04:32 CST every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. 释放空间（使用稳定通用的瘦身 Action，避免磁盘被吃满）
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          
      

      # 2. 一次性登录 GHCR 和 阿里云 ACR（凭据写入同一个 Podman/Docker 认证池）
      - name: Log in to Registries (GHCR & Aliyun ACR)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          podman login ${{ secrets.ALIYUN_ACR_REGISTRY }} -u ${{ secrets.ALIYUN_ACR_USERNAME }} -p ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 3. 使用官方容器镜像执行构建（显式连接 Podman socket 并指定 build-driver）
      - name: Build and Push Locally
        run: |
          # 启动宿主机的 podman socket 服务
          sudo systemctl start podman.socket

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "Running PR build (no push)..."
            sudo podman run --rm --privileged \
              -v /run/podman/podman.sock:/var/run/docker.sock \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              --entrypoint bluebuild \
              ghcr.io/blue-build/cli:latest \
              build --build-driver podman recipes/${{ matrix.recipe }}
          else
            echo "Building image and pushing directly to GHCR and Aliyun ACR..."
            
            sudo podman run --rm --privileged \
              -v /run/podman/podman.sock:/var/run/docker.sock \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v ${{ github.workspace }}:/workspace \
              -v /run/user/1001/containers/auth.json:/root/.config/containers/auth.json:ro \
              -e COSIGN_PRIVATE_KEY="${{ secrets.SIGNING_SECRET }}" \
              -w /workspace \
              --entrypoint bluebuild \
              ghcr.io/blue-build/cli:latest \
              build --build-driver podman recipes/${{ matrix.recipe }}

            # 直接从本地 Podman 存储打 Tag 并推往阿里云 ACR
            echo "Tagging and pushing directly to Aliyun ACR (Zero download)..."
            sudo podman tag ghcr.io/edwardwoodhub/my-lxqt-cloud:latest ${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-cloud:latest
            sudo podman push ${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-cloud:latest
          fi
          
         
      
      

# ==========================================
  # Job 2：【保持原样】将上面构建好的容器镜像转换为 qcow2 镜像并作为 Artifacts 供下载
  # ==========================================
  build-disk:
    name: Build QCOW2 Disk Image
    runs-on: ubuntu-latest
    needs: bluebuild # 必须要等 Job 1（容器构建）成功后才会执行此步骤
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # 1. 释放 GitHub Runner 的磁盘空间
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 检出代码以读取必要信息
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 3. 登录 GHCR
      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 提前拉取镜像
      - name: Pull Custom Image to Local
        run: |
          sudo podman pull ghcr.io/edwardwoodhub/my-lxqt-cloud:latest

      # 5. 使用 bootc-image-builder 转换 qcow2
      - name: Build QCOW2
        run: |
          echo "正在安装 qemu-utils..."
          sudo apt-get update && sudo apt-get install -y qemu-utils
          
          mkdir -p ./output
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/edwardwoodhub/my-lxqt-cloud:latest

          echo "检测到生成了 disk.qcow2，开始进行 QEMU 极限块压缩..."
          sudo qemu-img convert -c -O qcow2 ./output/qcow2/disk.qcow2 ./output/qcow2/compressed.qcow2
          sudo mv ./output/qcow2/compressed.qcow2 ./output/qcow2/disk.qcow2
          
          echo "压缩完成！最终文件大小为："
          ls -lh ./output/qcow2/disk.qcow2

      # 6. 上传 Artifact
      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lxqt-qcow2
          path: ./output/qcow2/disk.qcow2
          if-no-files-found: error
