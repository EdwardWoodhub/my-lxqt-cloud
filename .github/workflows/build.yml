name: Build LXQt Cloud-OS Based On Fedora 44 Bootc Image
on:
  schedule:
    - cron: "32 20 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-pipeline:
    name: Build System, LiveISO, QCOW2 & Push Registries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. 释放虚拟机磁盘空间
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      # 2. 登录 GHCR 和 阿里云 ACR（为最后的推送做准备）
      - name: Log in to Registries (GHCR & Aliyun ACR)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "Logging in to Aliyun ACR..."
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | sudo podman login ${{ secrets.ALIYUN_ACR_REGISTRY }} -u${{ secrets.ALIYUN_ACR_USERNAME }} --password-stdin

      # 3. 本地原生构建系统容器镜像
      - name: Build System Image
        run: |
          echo "Starting native Podman build..."
          sudo podman build \
            --security-opt seccomp=unconfined \
            -t ghcr.io/edwardwoodhub/my-lxqt-cloud:latest \
            -t ${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-cloud:latest \
            -f Containerfile .

      # ==========================================
      # 阶段 1：先构建 LiveISO 并发布到 GitHub Releases
      # ==========================================
      - name: Build LiveISO using bootc-image-builder
        run: |
          mkdir -p ./output/iso
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output/iso:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            ghcr.io/edwardwoodhub/my-lxqt-cloud:latest

          # 修复输出权限，避免 runner 用户无写权限报错
          sudo chown -R $(id -u):$(id -g) ./output/iso

          ISO_FILE=$(find ./output/iso -type f -name "*.iso" | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "Error: 未找到生成的 ISO 文件！"
            exit 1
          fi
          mv "$ISO_FILE" ./my-lxqt-cloud.iso
          ls -lh ./my-lxqt-cloud.iso

      - name: Split ISO
        run: |
          split -b 1500M my-lxqt-cloud.iso my-lxqt-cloud.iso.part-
          ls -lh my-lxqt-cloud.iso.part-*

      - name: Publish LiveISO to GitHub Releases
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          files: my-lxqt-cloud.iso.part-*
          tag_name: release-${{ github.run_number }}
          name: "LXQt Cloud LiveISO Build #${{ github.run_number }}"
          body: |
            ### LXQt Cloud LiveISO 发布
            - 镜像版本: `latest`
            - 合并分卷命令（Linux/macOS）:
              ```bash
              cat my-lxqt-cloud.iso.part-* > my-lxqt-cloud.iso
              ```
            - 合并分卷命令（Windows PowerShell）:
              ```powershell
              Get-Content my-lxqt-cloud.iso.part-* -ReadCount 0 -Encoding Byte | Set-Content my-lxqt-cloud.iso -Encoding Byte
              ```
          generate_release_notes: true

      # 清理 ISO 文件以释放磁盘空间，避免后续构建 qcow2 时磁盘溢出
      - name: Clean ISO Files
        run: |
          rm -rf ./output/iso ./my-lxqt-cloud.iso ./my-lxqt-cloud.iso.part-*

      # ==========================================
      # 阶段 2：然后生成 QCOW2 磁盘镜像并上传 Artifacts
      # ==========================================
      - name: Build QCOW2 Disk Image
        run: |
          echo "正在安装 qemu-utils..."
          sudo apt-get update && sudo apt-get install -y qemu-utils
          
          mkdir -p ./output/qcow2
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v ./output/qcow2:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            ghcr.io/edwardwoodhub/my-lxqt-cloud:latest

          # 修复输出权限
          sudo chown -R $(id -u):$(id -g) ./output/qcow2

          echo "检测到生成了 disk.qcow2，开始进行 QEMU 极限块压缩..."
          sudo qemu-img convert -c -O qcow2 ./output/qcow2/qcow2/disk.qcow2 ./output/qcow2/qcow2/compressed.qcow2
          sudo mv ./output/qcow2/qcow2/compressed.qcow2 ./output/qcow2/qcow2/disk.qcow2
          
          echo "压缩完成！最终文件大小为："
          ls -lh ./output/qcow2/qcow2/disk.qcow2

      - name: Upload QCOW2 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lxqt-qcow2
          path: ./output/qcow2/qcow2/disk.qcow2
          if-no-files-found: error

      # 清理 QCOW2 文件释放磁盘
      - name: Clean QCOW2 Files
        run: |
          rm -rf ./output/qcow2

      # ==========================================
      # 阶段 3：最后把 Blob 推送到 GHCR 和 阿里云 ACR
      # ==========================================
      - name: Push Images to Registries (GHCR & ACR)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Pushing directly to Aliyun ACR..."
          sudo podman push ${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-cloud:latest

          echo "Pushing to GHCR..."
          sudo podman push ghcr.io/edwardwoodhub/my-lxqt-cloud:latest
